name: Trader source and installer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original source and inspect setup safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm no compiled EA or private files were added
        run: |
          if find . -type f \( -iname '*.ex5' -o -iname '*.env' \) -not -path './.git/*' | grep .; then
            echo 'ERROR: compiled EA or local credentials in repository'
            exit 1
          fi

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('tools/setup_windows.ps1', 'tools/diagnose_mt5.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
            Write-Host ("Passed syntax: " + $file)
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell installer syntax verified; no broker process invoked.'
