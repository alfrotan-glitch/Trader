name: Trader source and installer checks

on:
  push:
    branches: [main, 'research/spread-gate-ab-20261104']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original source and inspect setup safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm no compiled EA or private files were added
        run: |
          if find . -type f \( -iname '*.ex5' -o -iname '*.env' \) -not -path './.git/*' | grep .; then
            echo 'ERROR: compiled EA or local credentials in repository'
            exit 1
          fi

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('tools/setup_windows.ps1', 'tools/diagnose_mt5.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
            Write-Host ("Passed syntax: " + $file)
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell installer syntax verified; no broker process invoked.'
      - name: Verify isolated entry-quality trial source and profile (no MT5 needed)
        shell: powershell
        run: |
          $script = 'tools/install_entry_quality_trial.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Entry trial script syntax valid.'
          & .\tools\install_entry_quality_trial.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Entry trial source hash verification failed.' }
          Write-Host 'Pinned trial, vendor original and research preset verified offline.'
      - name: Verify Nyao diagnostic installer and tester-only source (no MT5 installed)
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = 'tools/install_nyao_diagnostics.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          & .\tools\install_nyao_diagnostics.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Nyao research file integrity validation failed' }
          Write-Host 'Diagnostic installer parsed; exact research preset and unchanged vendor validated.'
      - name: Smoke-run read-only diagnostic without MT5 installed
        shell: powershell
        run: |
          & .\tools\diagnose_mt5.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Read-only MT5 diagnostic smoke test failed.' }
      - name: Verify one-click runner makes failure ZIP without installed MT5
        shell: powershell
        run: |
          & .\RUN_NYAO_STOP_RECOVERY.bat
          if ($LASTEXITCODE -ne 2) { throw 'Expected fail-closed status without local MT5.' }
          $zips = @(Get-ChildItem -File 'NYAO_STOP_RECOVERY_EVIDENCE_*.zip' -ErrorAction SilentlyContinue)
          if ($zips.Count -ne 1) { throw ('Expected one failure evidence ZIP, found ' + $zips.Count) }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ('manifest.json' -notin $names -or 'runner.log' -notin $names -or 'READ_ME_FIRST.txt' -notin $names) {
              throw 'Failure ZIP missing manifest, runner log or README'
            }
            if (@($names | Where-Object { $_ -match 'private_tester|\.ini$|archive/' }).Count -gt 0) {
              throw 'Failure ZIP includes private account config or archives'
            }
          } finally { $archive.Dispose() }
          Write-Host 'PASS: failed safely and packaged evidence without MetaTrader installation.'
          exit 0
      - name: Refuse unsafe tester auto-start before terminal discovery
        shell: powershell
        run: |
          & .\tools\setup_windows.ps1 -LaunchTester
          if ($LASTEXITCODE -ne 2) { throw 'Unsafe auto-launch was not blocked.' }
          Write-Host 'Unsafe headless auto-launch blocked as designed.'
          exit 0
